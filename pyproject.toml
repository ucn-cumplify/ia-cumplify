[project]
name = "ia-cumplify"
version = "0.1.0"
description = "FastAPI service to classify regulatory articles with OpenAI GPT-5.6 Luna"
authors = [
    { name = "towcrash", email = "fernando.vega@alumnos.ucn.cl" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.68.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.20",
]

[project.scripts]
ia-cumplify = "ia_cumplify.cli:main"
ia-cumplify-serve = "ia_cumplify.cli:serve"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "disconnect: uvicorn and a fake OpenAI as real servers on 127.0.0.1 (CHT-011); they run by default, deselect them with -m 'not disconnect'",
]
