[project]
name = "ia-cumplify"
version = "0.1.0"
description = "FastAPI service to classify regulatory articles with OpenAI GPT-5.6 Luna"
authors = [
    { name = "towcrash", email = "fernando.vega@alumnos.ucn.cl" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.68.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.scripts]
ia-cumplify = "ia_cumplify.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
